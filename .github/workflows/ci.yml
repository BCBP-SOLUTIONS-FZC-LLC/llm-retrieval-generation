# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/llm-retrieval-generation
#
#   validate-test ────────────┐
#   validate-quality ─────────┤
#   build-image ──┬─► trivy ──┼──► pr-summary (PR events only)
#                 └─► smoke ──┴──► push       (push events only: image to GHCR, signed)
#
# Mirrors iam-org-membership's ci.yml. Job names match the organisation ruleset's required checks
# (Build image (cache), Trivy CVE scan, Smoke tests). The image is built once into the GHA cache,
# then scanned and boot-tested from it; release.yml signs and pushes it on a tag.
#
# paths-ignore skips the pipeline for commits that only touch Markdown docs.
name: CI

"on":
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/llm-retrieval-generation
  BUILDKIT_PROGRESS: plain

jobs:
  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    secrets:
      CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}

  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    secrets:
      CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}

  # Lints the Dockerfile first (a hadolint failure never starts the expensive build), then writes
  # every layer to the GHA and registry caches; trivy and smoke load from it instead of rebuilding.
  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      # SOURCE_DATE_EPOCH + cache targets (grouped in docker-build-prep.sh).
      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/docker-build-prep.sh

      # Log in so registry cache reads (and writes on non-fork runs) are authenticated.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image -> cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          # Pull fresh base images on push/manual runs; skip on PRs for speed.
          pull: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.cache.outputs.SOURCE_DATE_EPOCH }}

  # The release gate (same settings as release.yml and `make trivy`): a CRITICAL or HIGH finding
  # with a fix fails the check.
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # All layers come from the GHA cache the build-image job wrote: near-instant.
      - name: Load image from cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: retrieval-generation:ci
          build-args: BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Table format: readable in the CI log; fails on a fixable CRITICAL or HIGH finding.
      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: retrieval-generation:ci
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          cache-dir: /tmp/trivy-cache

      - name: Scan image for CVEs (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: retrieval-generation:ci
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # CycloneDX SBOM: component inventory for compliance and audit.
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: retrieval-generation:ci
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # Migrations, API start and /ready = 200 against the compose Postgres + PgBouncer.
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # All layers come from the GHA cache the build-image job wrote: near-instant.
      - name: Load image from cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: retrieval-generation:ci
          build-args: BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha

      - name: Boot image
        run: |
          docker compose up -d --wait postgres pgbouncer redis qdrant
          .github/scripts/image-boot-check.sh retrieval-generation:ci

  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality, build-image, trivy, smoke]
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Post or update summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('fs')
            const code = fs.readFileSync('.github/scripts/pr-summary.js', 'utf8')
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor
            const run = new AsyncFunction('github', 'context', 'core', 'require', 'process', code)
            await run(github, context, core, require, process)

  # Push to GHCR on merge to main: branch and sha tags, SLSA provenance and SBOM attestations,
  # keyless Cosign signature. Release tags are published by release.yml.
  push:
    name: Push image -> GHCR
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality, trivy, smoke]
    if: github.event_name == 'push'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: bash .github/scripts/set-source-date-epoch.sh

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: pushed
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via Sigstore OIDC: no long-lived key to rotate or leak.
      - name: Sign image with Cosign
        run: |
          cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.github/workflows/.*@refs/heads/(main|master)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Log image digest
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh
