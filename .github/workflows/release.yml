# Triggered by version tags (v1.0.0, v1.1.0-rc.1).
# Pipeline: validate -> build the image and scan it (CVE gate) -> push -> SBOM -> provenance -> sign -> GitHub Release.
# Unlike a build-then-scan flow, nothing is pushed until the scan passes.
# Not deployed from here: no job applies the Helm chart (see VERSIONING.md, Planned).
name: Release

"on":
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/llm-retrieval-generation
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  docker:
    name: Docker image -> GHCR
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality]
    outputs:
      digest: ${{ steps.pushed.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Verify release tag matches checkout
        run: bash .github/scripts/verify-release-tag.sh

      # Block the release if CHANGELOG.md has no section for this tag.
      - name: Verify CHANGELOG entry exists
        run: bash .github/scripts/verify-changelog-entry.sh

      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: bash .github/scripts/set-source-date-epoch.sh

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into the local daemon first: the scan below must pass before anything is pushed.
      - name: Build image (not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: scan-candidate:${{ env.RELEASE_TAG }}
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Critical/High findings with a fix fail the release: a known-vulnerable image must not be
      # tagged as a release that consumers pin.
      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-candidate:${{ env.RELEASE_TAG }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          cache-dir: /tmp/trivy-cache

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # The chart's migration Job and the API pods start from this image: smoke it before pushing.
      - name: Smoke test the image (non-root, imports, no compiler)
        run: |
          set -euo pipefail
          img=scan-candidate:${RELEASE_TAG}
          test "$(docker run --rm --entrypoint id "$img" -u)" = 10001
          docker run --rm --entrypoint python "$img" -c "import rag.presentation.main"
          if docker run --rm --entrypoint sh "$img" -c 'command -v gcc' >/dev/null 2>&1; then
            echo "::error::the runtime image contains a compiler"; exit 1
          fi

      - name: Boot test (migrate, start, /ready) against Postgres + PgBouncer
        run: |
          docker compose up -d --wait postgres pgbouncer redis qdrant
          .github/scripts/image-boot-check.sh scan-candidate:${RELEASE_TAG}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: pushed
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
          cache-from: type=gha

      # CycloneDX SBOM: component inventory for compliance and audit.
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ env.RELEASE_TAG }}
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Export SLSA provenance
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
        run: bash .github/scripts/export-image-provenance.sh

      - name: Upload provenance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-${{ env.RELEASE_TAG }}
          path: provenance.slsa.json
          retention-days: 90

      - name: Sign image with Cosign
        run: |
          cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.github/workflows/.*@refs/tags/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

  # GitHub Release: notes from CHANGELOG.md plus the SBOM and SLSA provenance. Only after the image
  # is pushed, scanned and signed. No deploy gate: nothing here applies the Helm chart yet.
  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Extract release notes from CHANGELOG
        env:
          IMAGE_VERSION: ${{ needs.docker.outputs.version }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: bash .github/scripts/extract-release-notes.sh

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ env.RELEASE_TAG }}

      - name: Download provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-${{ env.RELEASE_TAG }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: bash .github/scripts/create-github-release.sh
