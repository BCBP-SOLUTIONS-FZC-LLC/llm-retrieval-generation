[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "retrieval-generation"
version = "0.1.0"
description = "LLM retrieval-generation service (LLD: docs/lld/llm-lld-retrieval-generation-service.md)"
requires-python = ">=3.12"
dependencies = [
    "platform-fastapicommon>=0.4.1,<0.5",
    "pgcommon[fastapi,structlog]>=0.4.1,<0.5",
    "eventcommon>=0.4.0,<0.5",
    "fastapi>=0.115.10",
    "uvicorn>=0.29",
    "pydantic-settings>=2.2",
    "temporalio>=1.7",
    "qdrant-client>=1.9",
    "redis>=5.0",
    "boto3>=1.40.61",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration and not e2e'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "integration: needs Docker (testcontainers); skipped by default, run with `make test-integration`",
    "e2e: real app over real Postgres (testcontainers); skipped by default, run with `make test-e2e`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]
ignore = ["D105", "D107", "D203", "D213", "D401", "ANN401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag"]

[[tool.mypy.overrides]]
# platform-fastapicommon ships no py.typed marker; its source is fully annotated.
module = ["fastapicommon", "fastapicommon.*"]
follow_untyped_imports = true
