# Local infrastructure for llm-retrieval-generation (`make docker-up`).
#
# Infra only — there is no `app` service. Run the API
# on the host with `make run` against these containers (see .env-example).
#
# Host ports (incl. floci-ui on 4501) are chosen to sit beside the IAM services' stacks (5433/5434/5533/5534, 6379/6380,
# 4566/4567, 4500) without colliding.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: rag_admin          # superuser: migrations (DDL) connect as this, direct
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: llm_corpus           # llm_generation is created by scripts/init-db.sql
    ports:
      - "5535:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_admin -d llm_corpus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Transaction-mode pooler (LLD §18.2): the app's DSNs go through here, the migration DSNs do not
  # (the migration runner's advisory lock is session-scoped).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "5536:5432"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: rag_app_login
      DB_PASSWORD: devpassword
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "10"           # = PG_MAX_CONNS (§18.2)
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      SERVER_TLS_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U rag_app_login || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6335:6333"   # REST
      - "6336:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # S3 + SNS + SQS emulator (same one the IAM services use). TEMPORAL_ADDRESS stays unset
  # locally: the async workflow routes answer 503 WORKFLOW_ENGINE_UNAVAILABLE by design.
  floci:
    image: floci/floci:2.1.0-compat
    ports:
      - "4568:4566"
    environment:
      FLOCI_DEFAULT_REGION: eu-west-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      # Host in the QueueUrl / TopicArn floci returns. Must resolve from inside floci-ui's
      # container (it follows those URLs directly), else per-queue attributes come back empty.
      # Host-side code uses the explicit URLs in .env, so this does not affect `make run`.
      FLOCI_HOSTNAME: floci
    volumes:
      - floci_data:/app/data
      - ./scripts/init-floci.sh:/etc/floci/init/ready.d/init-floci.sh:ro
    healthcheck:
      # The LAST resource init-floci.sh creates, so "healthy" means the script finished.
      test: ["CMD", "aws", "--region", "eu-west-1", "sqs", "get-queue-url", "--queue-name", "usage-rag-q"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Web console for floci: browse S3 / SNS / SQS at http://localhost:4501 (message counts live).
  floci-ui:
    image: floci/floci-ui:0.5.0
    ports:
      - "4501:4500"   # 4500 is the IAM stacks' floci-ui
    environment:
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://floci:4566
      FLOCI_ENDPOINT: http://floci:4566   # the console's own connectivity probe reads this one
      PORT: "4500"
    depends_on:
      floci:
        condition: service_healthy

  # --- opt-in: `make gateway-up` (docker compose --profile gateway) --------------------------
  # The model gateway (Agent Router, formerly Envoy AI Gateway) in standalone mode, in front of a
  # model stub. Pinned to a release tag: `latest` is a development build.
  model-stub:
    profiles: ["gateway"]
    build: ./scripts/model-stub
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-router:
    profiles: ["gateway"]
    image: envoyproxy/ai-gateway-cli:v1.2.0
    command: ["run", "/config/${AIGW_CONFIG:-aigw.yaml}"]   # aigw-ollama.yaml: `make gateway-up-ollama`
    ports:
      - "1975:1975"   # the gateway; point GATEWAY_BASE_URL at http://localhost:1975
      - "1064:1064"   # admin: /health, /metrics
    volumes:
      - ./deploy/model-gateway:/config:ro
    depends_on:
      model-stub:
        condition: service_healthy

  # --- opt-in: `make gateway-up-ollama`: real local models behind the gateway --------------------
  # Ollama serves the embedding and chat task classes (see deploy/model-gateway/aigw-ollama.yaml).
  # CPU only, one model resident at a time so it fits the Docker VM.
  ollama:
    profiles: ["ollama"]
    image: alpine/ollama:0.12.0
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 2m
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # one-shot: fetch the three small models into the volume (a no-op once they are there)
  ollama-pull:
    profiles: ["ollama"]
    image: alpine/ollama:0.12.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:1.5b && ollama pull llama3.2:1b && ollama pull nomic-embed-text"]
    restart: "no"

  # A chat UI over the gateway: pick a task class as the "model" and talk to it. Everything it
  # sends goes through Agent Router, so it is the same path our service's client takes.
  open-webui:
    profiles: ["gateway"]
    image: ghcr.io/open-webui/open-webui:v0.6.43
    ports:
      - "3000:8080"
    environment:
      WEBUI_AUTH: "False"                    # local single-user, no sign-up screen
      ENABLE_PERSISTENT_CONFIG: "False"      # the variables below win over the saved settings
      ENABLE_OLLAMA_API: "False"
      OPENAI_API_BASE_URL: http://agent-router:1975/v1
      OPENAI_API_KEY: not-used               # the gateway does not check it locally
      # keep the stub's request log to what you type: no background title/tag/follow-up calls
      ENABLE_TITLE_GENERATION: "False"
      ENABLE_TAGS_GENERATION: "False"
      ENABLE_FOLLOW_UP_GENERATION: "False"
      ENABLE_AUTOCOMPLETE_GENERATION: "False"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      agent-router:
        condition: service_started

volumes:
  postgres_data:
  open_webui_data:
  ollama_data:
  qdrant_data:
  floci_data:
