apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-retrieval-generation.fullname" . }}
  labels:
    {{- include "llm-retrieval-generation.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "llm-retrieval-generation.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge: 0 keeps the rollout node-count neutral: with hard pod anti-affinity a surge pod
      # cannot be scheduled when every node already holds a replica, and the rollout would stall.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "llm-retrieval-generation.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.existingSecret }}
        # An external secret (ESO / CSI): bump rotationEpoch to roll the pods after a rotation.
        rotationEpoch: {{ .Values.rotationEpoch | default "0" | quote }}
        {{- else }}
        # Recycle the pods when the chart-managed Secret changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ .Values.serviceAccount.name | default (include "llm-retrieval-generation.fullname" .) }}{{ else }}default{{ end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ include "llm-retrieval-generation.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # The migration Job owns the schema; replicas never apply library schemas at startup.
            - name: OUTBOX_APPLY_SCHEMA_ON_STARTUP
              value: {{ (not .Values.migrations.job.enabled) | quote }}
            {{- include "llm-retrieval-generation.env" . | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        # Hard anti-affinity: a single node failure must not take the service to zero despite the PDB.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "llm-retrieval-generation.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
