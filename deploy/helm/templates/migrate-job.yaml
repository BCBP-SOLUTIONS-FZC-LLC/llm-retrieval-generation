{{- /*
Schema migration Job: runs `python -m rag.infrastructure.persistence.migrate` once per release,
before the new replicas start (Helm pre-install / pre-upgrade hook). It applies eventcommon's
outbox and inbox schemas, then both numbered migration sets, over the direct *_MIGRATION_DATABASE_URL
DSNs (session-scoped advisory lock, DDL). One Job, never one per replica: the library's schema calls
take no advisory lock and must not race. A failed migration fails the release.
*/ -}}
{{- if .Values.migrations.job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "llm-retrieval-generation.fullname" . }}-migrate
  labels:
    {{- include "llm-retrieval-generation.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.job.activeDeadlineSeconds }}
  template:
    metadata:
      # Deliberately NOT the chart's selectorLabels: the Service, PDB and NetworkPolicy select on
      # those and must never pick up this pod.
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ include "llm-retrieval-generation.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "rag.infrastructure.persistence.migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "llm-retrieval-generation.env" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
