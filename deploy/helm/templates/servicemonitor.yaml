{{- if .Values.serviceMonitor.enabled }}
# Dormant until ENABLE_METRICS=true and OBSERVABILITY_DOMAIN is a registered domain (OQ-103): the
# app serves /metrics only then. Metrics share the API port, so the NetworkPolicy admits the
# monitoring namespace to that port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "llm-retrieval-generation.fullname" . }}
  labels:
    {{- include "llm-retrieval-generation.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "llm-retrieval-generation.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.serviceMonitor.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
