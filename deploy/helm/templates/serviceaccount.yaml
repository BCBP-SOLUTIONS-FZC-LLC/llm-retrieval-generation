{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "llm-retrieval-generation.fullname" .) }}
  labels:
    {{- include "llm-retrieval-generation.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# IRSA injects a projected token through the pod identity webhook, not the API token mount.
automountServiceAccountToken: false
{{- end }}
