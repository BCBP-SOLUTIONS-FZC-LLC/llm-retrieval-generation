{{- /*
Secret management, two modes:

1. existingSecret (production): the name of a pre-provisioned Secret (External Secrets Operator,
   Secrets Manager CSI, Sealed Secrets). The chart creates no Secret and secretValues is ignored.
2. secretValues (dev / CI only): supply values with --set 'secretValues.CORPUS_DATABASE_URL=...'.
   WARNING: Helm stores them in the release history (base64, not encrypted).

AWS credentials are not in the Secret: the pod's ServiceAccount carries an IRSA role
(serviceAccount.annotations, deploy/irsa/).
*/ -}}
{{- if not .Values.existingSecret }}
{{- range .Values.envFromSecret }}
{{- $val := index $.Values.secretValues . }}
{{- if not $val }}
{{- fail (printf "Secret key %q is required but not set. Either set existingSecret to an existing Secret name, or provide the value via: --set 'secretValues.%s=<value>'." . .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-retrieval-generation.fullname" . }}-secrets
  labels:
    {{- include "llm-retrieval-generation.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- if .Values.migrations.job.enabled }}
    # Created before the migration hook Job, which reads the migration DSNs from it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
type: Opaque
stringData:
  {{- range (concat .Values.envFromSecret .Values.envFromSecretOptional) }}
  {{- $v := index $.Values.secretValues . }}
  {{- if $v }}
  {{ . }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
