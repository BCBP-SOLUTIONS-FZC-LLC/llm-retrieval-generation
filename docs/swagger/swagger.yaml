components:
  schemas:
    ActivateRequest:
      description: 'C-I4: the collection''s ``record_version``.'
      properties:
        record_version:
          minimum: 1.0
          title: Record Version
          type: integer
      required:
      - record_version
      title: ActivateRequest
      type: object
    ActivateResponse:
      description: C-I4 body; ``previous`` is always present and null on a first activation.
      properties:
        active_index_generation:
          title: Active Index Generation
          type: integer
        previous:
          anyOf:
          - type: integer
          - type: 'null'
          title: Previous
        record_version:
          title: Record Version
          type: integer
      required:
      - active_index_generation
      - previous
      - record_version
      title: ActivateResponse
      type: object
    AnswerRequest:
      description: 'R-2 body. ``scope.tender_id`` is optional: an answer may stand free of a tender.'
      properties:
        prior_refinement:
          anyOf:
          - $ref: '#/components/schemas/PriorRefinementBody'
          - type: 'null'
        question:
          maxLength: 4000
          minLength: 1
          title: Question
          type: string
        requested_mode:
          default: assistance
          enum:
          - assistance
          - automation
          title: Requested Mode
          type: string
        scope:
          $ref: '#/components/schemas/ScopeBody'
      required:
      - question
      title: AnswerRequest
      type: object
    AppliedProfile:
      description: '``applied_profile`` of R-1.'
      properties:
        candidate_depth:
          title: Candidate Depth
          type: integer
        rerank_in:
          title: Rerank In
          type: integer
        rerank_out:
          title: Rerank Out
          type: integer
        source:
          title: Source
          type: string
        values_provisional:
          title: Values Provisional
          type: boolean
      required:
      - source
      - values_provisional
      - candidate_depth
      - rerank_in
      - rerank_out
      title: AppliedProfile
      type: object
    ApproveRequest:
      description: W-3 body.
      properties:
        outline_version:
          minimum: 1.0
          title: Outline Version
          type: integer
      required:
      - outline_version
      title: ApproveRequest
      type: object
    ArtefactResponse:
      description: A-1.
      properties:
        archive_state:
          title: Archive State
          type: string
        archived_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Archived At
        capability:
          title: Capability
          type: string
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        created_by:
          format: uuid
          title: Created By
          type: string
        current_run_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Current Run Id
        current_version:
          anyOf:
          - $ref: '#/components/schemas/VersionSummary'
          - type: 'null'
        id:
          format: uuid
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        record_version:
          title: Record Version
          type: integer
        status:
          title: Status
          type: string
        target_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Ref
        tender_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Tender Id
        tender_section_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Tender Section Ref
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
      required:
      - id
      - tender_id
      - kind
      - capability
      - tender_section_ref
      - target_ref
      - status
      - archive_state
      - archived_at
      - created_by
      - current_run_id
      - record_version
      - created_at
      - updated_at
      - current_version
      title: ArtefactResponse
      type: object
    CancelRequest:
      description: 'W-5 body: free text, at most 256 characters.'
      properties:
        reason:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Reason
      title: CancelRequest
      type: object
    Chunk:
      description: '``Chunk``.'
      properties:
        chunk_id:
          title: Chunk Id
          type: string
        clause_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Clause Ref
        collection_id:
          format: uuid
          title: Collection Id
          type: string
        collection_weight:
          title: Collection Weight
          type: number
        document_id:
          format: uuid
          title: Document Id
          type: string
        document_role:
          title: Document Role
          type: string
        document_title:
          title: Document Title
          type: string
        document_version:
          title: Document Version
          type: integer
        excerpt:
          title: Excerpt
          type: string
        excerpt_is_translation:
          title: Excerpt Is Translation
          type: boolean
        fused_score:
          title: Fused Score
          type: number
        heading_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Heading Path
        language:
          title: Language
          type: string
        parent_chunk_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Chunk Id
        purged:
          title: Purged
          type: boolean
        rank:
          title: Rank
          type: integer
        rerank_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Rerank Score
        source_half:
          title: Source Half
          type: string
        source_span:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Source Span
      required:
      - rank
      - chunk_id
      - parent_chunk_id
      - document_id
      - document_version
      - document_title
      - heading_path
      - clause_ref
      - document_role
      - language
      - collection_id
      - collection_weight
      - fused_score
      - rerank_score
      - source_half
      - excerpt
      - excerpt_is_translation
      - source_span
      - purged
      title: Chunk
      type: object
    Citation:
      description: '``Citation``.'
      properties:
        cited_chunk_ids:
          items:
            type: string
          title: Cited Chunk Ids
          type: array
        claim_ordinal:
          title: Claim Ordinal
          type: integer
        corrected_chunk_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Corrected Chunk Ids
        outcome:
          title: Outcome
          type: string
        tier_decided:
          title: Tier Decided
          type: integer
      required:
      - claim_ordinal
      - outcome
      - cited_chunk_ids
      - corrected_chunk_ids
      - tier_decided
      title: Citation
      type: object
    ClassifyRequest:
      description: 'R-6 body: 1 MB of caller-supplied content (§5.2).'
      properties:
        content:
          maxLength: 1000000
          minLength: 1
          title: Content
          type: string
        domain_profile_ref:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Domain Profile Ref
        filename:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Filename
      required:
      - content
      title: ClassifyRequest
      type: object
    ClassifyResponse:
      description: 'R-6: stateless proposal (MD-21).'
      properties:
        alternatives:
          items:
            $ref: '#/components/schemas/RoleAlternativeBody'
          title: Alternatives
          type: array
        confidence:
          title: Confidence
          type: number
        proposed_role:
          title: Proposed Role
          type: string
        taxonomy_version:
          title: Taxonomy Version
          type: string
      required:
      - proposed_role
      - confidence
      - alternatives
      - taxonomy_version
      title: ClassifyResponse
      type: object
    Coherence:
      description: The coherence verdict.
      properties:
        computed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Computed At
        verdict:
          title: Verdict
          type: string
      required:
      - verdict
      - computed_at
      title: Coherence
      type: object
    CollectionListResponse:
      description: P-1 body.
      properties:
        collections:
          items:
            $ref: '#/components/schemas/CollectionResponse'
          title: Collections
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
      required:
      - collections
      - limit
      - offset
      title: CollectionListResponse
      type: object
    CollectionResponse:
      description: 'P-2 body and a P-1 entry: placement without the physical collection name.'
      properties:
        active_index_generation:
          title: Active Index Generation
          type: integer
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        id:
          format: uuid
          title: Id
          type: string
        knowledge_level:
          title: Knowledge Level
          type: string
        promoted_from:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Promoted From
        record_version:
          title: Record Version
          type: integer
        restricted:
          title: Restricted
          type: boolean
        status:
          title: Status
          type: string
        tender_closed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Tender Closed At
        tender_id:
          format: uuid
          title: Tender Id
          type: string
        type:
          title: Type
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        weight_override:
          anyOf:
          - type: number
          - type: 'null'
          title: Weight Override
      required:
      - id
      - type
      - knowledge_level
      - tender_id
      - status
      - restricted
      - active_index_generation
      - weight_override
      - promoted_from
      - tender_closed_at
      - record_version
      - created_at
      - updated_at
      title: CollectionResponse
      type: object
    CompletenessDetail:
      description: Per-section completeness.
      properties:
        items_addressed:
          title: Items Addressed
          type: integer
        items_total:
          title: Items Total
          type: integer
        missed_items:
          items:
            type: string
          title: Missed Items
          type: array
      required:
      - items_total
      - items_addressed
      - missed_items
      title: CompletenessDetail
      type: object
    DraftRequest:
      description: R-3 body. ``tender_id`` is required; ``tender_section_ref`` is opaque (ART-4).
      properties:
        prior_refinement:
          anyOf:
          - $ref: '#/components/schemas/PriorRefinementBody'
          - type: 'null'
        requested_mode:
          default: assistance
          enum:
          - assistance
          - automation
          title: Requested Mode
          type: string
        scope:
          $ref: '#/components/schemas/ScopeBody'
        section_type:
          maxLength: 256
          minLength: 1
          title: Section Type
          type: string
        tender_id:
          format: uuid
          title: Tender Id
          type: string
        tender_section_ref:
          maxLength: 256
          minLength: 1
          title: Tender Section Ref
          type: string
        user_prompt:
          default: ''
          maxLength: 8000
          title: User Prompt
          type: string
      required:
      - tender_id
      - tender_section_ref
      - section_type
      title: DraftRequest
      type: object
    Eligibility:
      description: '``EligibilityVerdict``.'
      properties:
        clamp_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Clamp Reason
        clamped:
          title: Clamped
          type: boolean
        effective_mode:
          title: Effective Mode
          type: string
        profile_version:
          title: Profile Version
          type: string
        requested_mode:
          title: Requested Mode
          type: string
        state:
          title: State
          type: string
      required:
      - state
      - requested_mode
      - effective_mode
      - clamped
      - clamp_reason
      - profile_version
      title: Eligibility
      type: object
    EligibilityBody:
      description: '``EligibilityVerdict`` (§5.5, API-5).'
      properties:
        clamp_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Clamp Reason
        clamped:
          title: Clamped
          type: boolean
        effective_mode:
          title: Effective Mode
          type: string
        profile_version:
          title: Profile Version
          type: string
        requested_mode:
          title: Requested Mode
          type: string
        state:
          title: State
          type: string
      required:
      - state
      - requested_mode
      - effective_mode
      - clamped
      - clamp_reason
      - profile_version
      title: EligibilityBody
      type: object
    ExtractRequest:
      description: R-4 body.
      properties:
        document_ids:
          items:
            format: uuid
            type: string
          maxItems: 100
          title: Document Ids
          type: array
        schema_ref:
          maxLength: 256
          minLength: 1
          title: Schema Ref
          type: string
        scope:
          $ref: '#/components/schemas/ScopeBody'
        tender_id:
          format: uuid
          title: Tender Id
          type: string
        trigger_document_version_id:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Trigger Document Version Id
      required:
      - tender_id
      - schema_ref
      title: ExtractRequest
      type: object
    ExtractionResponse:
      description: 'R-4: ``200``, or ``206`` where ``degradation_markers`` is non-empty (§5.7.4).'
      properties:
        artefact_id:
          format: uuid
          title: Artefact Id
          type: string
        artefact_version_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Artefact Version Id
        degradation_markers:
          items:
            additionalProperties:
              type: string
            type: object
          title: Degradation Markers
          type: array
        eligibility:
          $ref: '#/components/schemas/EligibilityBody'
        evidence_tier:
          title: Evidence Tier
          type: string
        fields:
          additionalProperties:
            additionalProperties: true
            type: object
          title: Fields
          type: object
        generation_id:
          format: uuid
          title: Generation Id
          type: string
        refusal:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Refusal
        retrieval_set_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Retrieval Set Id
        schema_version:
          title: Schema Version
          type: string
      required:
      - artefact_id
      - generation_id
      - artefact_version_id
      - retrieval_set_id
      - schema_version
      - fields
      - evidence_tier
      - eligibility
      - degradation_markers
      title: ExtractionResponse
      type: object
    FactConflictResolutionRequest:
      description: A-7 body.
      properties:
        conflict_id:
          format: uuid
          title: Conflict Id
          type: string
        resolution:
          enum:
          - keep_established
          - update_fact
          - dismiss
          title: Resolution
          type: string
      required:
      - conflict_id
      - resolution
      title: FactConflictResolutionRequest
      type: object
    FactConflictResolutionResponse:
      description: 'A-7''s ``200``: nothing regenerates here; ``proceeds`` says the client may re-issue
        A-6.'
      properties:
        conflict_id:
          format: uuid
          title: Conflict Id
          type: string
        flagged_section_ids:
          items:
            format: uuid
            type: string
          title: Flagged Section Ids
          type: array
        proceeds:
          title: Proceeds
          type: boolean
        resolution:
          title: Resolution
          type: string
      required:
      - conflict_id
      - resolution
      - proceeds
      - flagged_section_ids
      title: FactConflictResolutionResponse
      type: object
    GapReportBody:
      description: '``GapReport`` (§5.5).'
      properties:
        blocking:
          title: Blocking
          type: boolean
        empty_collections:
          items:
            format: uuid
            type: string
          title: Empty Collections
          type: array
        missing_roles:
          items:
            type: string
          title: Missing Roles
          type: array
        unresolved_entities:
          items:
            type: string
          title: Unresolved Entities
          type: array
      required:
      - missing_roles
      - unresolved_entities
      - empty_collections
      - blocking
      title: GapReportBody
      type: object
    GenerationStateResponse:
      description: W-2.
      properties:
        artefact_id:
          format: uuid
          title: Artefact Id
          type: string
        coherence:
          $ref: '#/components/schemas/Coherence'
        current_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Stage
        established_facts:
          additionalProperties:
            type: string
          title: Established Facts
          type: object
        failed_at_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Failed At Stage
        failure_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Reason
        generation_id:
          format: uuid
          title: Generation Id
          type: string
        origin:
          default: original
          title: Origin
          type: string
        outline:
          $ref: '#/components/schemas/Outline'
        progress:
          $ref: '#/components/schemas/Progress'
        scope_narrowed:
          title: Scope Narrowed
          type: boolean
        sections:
          items:
            $ref: '#/components/schemas/SectionProgress'
          title: Sections
          type: array
        status:
          title: Status
          type: string
      required:
      - generation_id
      - artefact_id
      - status
      - outline
      - sections
      - established_facts
      - coherence
      - scope_narrowed
      - progress
      title: GenerationStateResponse
      type: object
    GrantEntryResponse:
      description: One P-3 entry.
      properties:
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        level:
          title: Level
          type: string
        projected_at:
          format: date-time
          title: Projected At
          type: string
        source:
          title: Source
          type: string
        subject_id:
          format: uuid
          title: Subject Id
          type: string
        subject_type:
          title: Subject Type
          type: string
      required:
      - subject_type
      - subject_id
      - level
      - projected_at
      - expires_at
      - source
      title: GrantEntryResponse
      type: object
    GrantListResponse:
      description: 'P-3 body. ``authoritative`` is a literal false: this service mints no grant (CG-2).'
      properties:
        authoritative:
          const: false
          default: false
          title: Authoritative
          type: boolean
        entries:
          items:
            $ref: '#/components/schemas/GrantEntryResponse'
          title: Entries
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        projection_freshness:
          $ref: '#/components/schemas/ProjectionFreshness'
      required:
      - entries
      - limit
      - offset
      - projection_freshness
      title: GrantListResponse
      type: object
    Groundedness:
      description: Per-section groundedness.
      properties:
        claims:
          items:
            $ref: '#/components/schemas/Citation'
          title: Claims
          type: array
        gaps:
          title: Gaps
          type: integer
        miscited:
          title: Miscited
          type: integer
        supported:
          title: Supported
          type: integer
        tiers_run:
          items:
            type: integer
          title: Tiers Run
          type: array
        unsupported:
          title: Unsupported
          type: integer
      required:
      - supported
      - unsupported
      - miscited
      - gaps
      - tiers_run
      - claims
      title: Groundedness
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MigrationResultRequest:
      description: 'C-I8: ``points_copied`` on ``complete``, ``reason`` on ``failed``.'
      properties:
        migration_id:
          format: uuid
          title: Migration Id
          type: string
        points_copied:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Points Copied
        reason:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Reason
        result:
          enum:
          - complete
          - failed
          title: Result
          type: string
      required:
      - migration_id
      - result
      title: MigrationResultRequest
      type: object
    MigrationResultResponse:
      description: C-I8 body.
      properties:
        collection_id:
          format: uuid
          title: Collection Id
          type: string
        record_version:
          title: Record Version
          type: integer
        status:
          title: Status
          type: string
      required:
      - collection_id
      - status
      - record_version
      title: MigrationResultResponse
      type: object
    ModelCatalogueResponse:
      description: C-M1 body.
      properties:
        as_of:
          format: date-time
          title: As Of
          type: string
        models:
          items:
            $ref: '#/components/schemas/ModelResponse'
          title: Models
          type: array
      required:
      - models
      - as_of
      title: ModelCatalogueResponse
      type: object
    ModelResponse:
      description: One C-M1 model.
      properties:
        id:
          title: Id
          type: string
        plans:
          items:
            type: string
          title: Plans
          type: array
        residency:
          title: Residency
          type: string
        task_classes:
          items:
            type: string
          title: Task Classes
          type: array
      required:
      - id
      - residency
      - task_classes
      - plans
      title: ModelResponse
      type: object
    Outline:
      description: Outline state and version.
      properties:
        gate_expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Gate Expires At
        ready_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Ready At
        sections:
          items:
            $ref: '#/components/schemas/OutlineSection'
          title: Sections
          type: array
        state:
          title: State
          type: string
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      required:
      - state
      - version
      - sections
      - ready_at
      - gate_expires_at
      title: Outline
      type: object
    OutlineEntryBody:
      description: 'One section of an edited outline: a reference and a type, never content.'
      properties:
        ref:
          maxLength: 256
          minLength: 1
          title: Ref
          type: string
        type:
          maxLength: 256
          minLength: 1
          title: Type
          type: string
      required:
      - ref
      - type
      title: OutlineEntryBody
      type: object
    OutlineSection:
      description: One outline entry.
      properties:
        ref:
          title: Ref
          type: string
        type:
          title: Type
          type: string
      required:
      - ref
      - type
      title: OutlineSection
      type: object
    PlacementResponse:
      description: C-I1 / C-I2 body (200 and 201 carry the same one).
      properties:
        active_index_generation:
          title: Active Index Generation
          type: integer
        collection_id:
          format: uuid
          title: Collection Id
          type: string
        knowledge_level:
          title: Knowledge Level
          type: string
        physical_collection:
          title: Physical Collection
          type: string
        purge_epoch:
          title: Purge Epoch
          type: integer
        record_version:
          title: Record Version
          type: integer
        restricted:
          title: Restricted
          type: boolean
        shard_key:
          title: Shard Key
          type: string
        status:
          title: Status
          type: string
        type:
          title: Type
          type: string
      required:
      - collection_id
      - physical_collection
