      tags:
      - retrieval
  /api/v1/collections:
    get:
      description: 'P-1: collections in the caller''s resolved scope; an empty scope is an empty list.'
      operationId: list_collections_api_v1_collections_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Limit
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Collections
      tags:
      - collections
  /api/v1/collections/{collection_id}:
    get:
      description: 'P-2: one collection; absent and ungranted are both 404 (CG-8).'
      operationId: get_collection_api_v1_collections__collection_id__get
      parameters:
      - in: path
        name: collection_id
        required: true
        schema:
          format: uuid
          title: Collection Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Collection
      tags:
      - collections
  /api/v1/collections/{collection_id}/grants:
    get:
      description: 'P-3: the last recorded overlay answer, for diagnosis. Never authoritative (CG-2).'
      operationId: list_grants_api_v1_collections__collection_id__grants_get
      parameters:
      - in: path
        name: collection_id
        required: true
        schema:
          format: uuid
          title: Collection Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Limit
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Grants
      tags:
      - collections
  /api/v1/collections/{collection_id}/retention:
    put:
      description: 'P-6: no ``record_version`` creates (201); one updates (200); anything else is 409.'
      operationId: put_retention_api_v1_collections__collection_id__retention_put
      parameters:
      - in: path
        name: collection_id
        required: true
        schema:
          format: uuid
          title: Collection Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRetentionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutRetentionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Put Retention
      tags:
      - collections
  /api/v1/extractions:
    post:
      description: 'R-4: structured extraction, synchronous, never streamed. ``206`` where degraded.'
      operationId: extractions_api_v1_extractions_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Extractions
      tags:
      - generation
  /api/v1/extractions/async:
    post:
      description: 'W-6: an extraction beyond R-4''s synchronous budget, as a workflow.'
      operationId: start_async_extraction_api_v1_extractions_async_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 255
          minLength: 1
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExtractionRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandleResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Start Async Extraction
      tags:
      - workflows
  /api/v1/generations:
    post:
      description: 'W-1: ``202`` with the handle; ``200`` where the key replays the same body (§5.7.12).'
      operationId: start_generation_api_v1_generations_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 255
          minLength: 1
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGenerationRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandleResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Start Generation
      tags:
      - workflows
  /api/v1/generations/{generation_id}:
    get:
      description: 'W-2: state, outline, per-section progress, facts, coherence (never from Temporal).'
      operationId: get_generation_api_v1_generations__generation_id__get
      parameters:
      - in: path
        name: generation_id
        required: true
        schema:
          format: uuid
          title: Generation Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Generation
      tags:
      - workflows
  /api/v1/generations/{generation_id}/cancel:
    post:
      description: 'W-5: cancel; completed sections remain durable and readable.'
      operationId: cancel_generation_api_v1_generations__generation_id__cancel_post
      parameters:
      - in: path
        name: generation_id
        required: true
        schema:
          format: uuid
          title: Generation Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CancelRequest'
              - type: 'null'
              title: Body
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Cancel Generation
      tags:
      - workflows
  /api/v1/generations/{generation_id}/outline:
    post:
      description: 'W-4: submit an edited outline; the workflow loops back to outline construction.'
      operationId: revise_outline_api_v1_generations__generation_id__outline_post
      parameters:
      - in: path
        name: generation_id
        required: true
        schema:
          format: uuid
          title: Generation Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Revise Outline
      tags:
      - workflows
  /api/v1/generations/{generation_id}/outline/approve:
    post:
      description: 'W-3: approve the outline; stage 1 begins when the signal lands.'
      operationId: approve_outline_api_v1_generations__generation_id__outline_approve_post
      parameters:
      - in: path
        name: generation_id
        required: true
        schema:
          format: uuid
          title: Generation Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
