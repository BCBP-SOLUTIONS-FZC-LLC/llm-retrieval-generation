      - instruction_refinement_id
      - review_context_read
      - review_context_ref
      - degradation_markers
      - delivery
      - eligibility
      - superseded_by_section_edit
      - disclaimer_ref
      title: VersionDetailResponse
      type: object
    VersionPage:
      description: A-2.
      properties:
        items:
          items:
            $ref: '#/components/schemas/VersionSummary'
          title: Items
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      title: VersionPage
      type: object
    VersionSection:
      description: One section of a document version.
      properties:
        completeness:
          title: Completeness
          type: string
        completeness_detail:
          anyOf:
          - $ref: '#/components/schemas/CompletenessDetail'
          - type: 'null'
        evidence_tier:
          title: Evidence Tier
          type: string
        groundedness:
          anyOf:
          - $ref: '#/components/schemas/Groundedness'
          - type: 'null'
        retrieval_set_id:
          format: uuid
          title: Retrieval Set Id
          type: string
        section_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Section Ref
        section_version_id:
          format: uuid
          title: Section Version Id
          type: string
      required:
      - section_ref
      - section_version_id
      - evidence_tier
      - completeness
      - retrieval_set_id
      - groundedness
      - completeness_detail
      title: VersionSection
      type: object
    VersionSummary:
      description: A version without verification records (API-8).
      properties:
        completeness:
          title: Completeness
          type: string
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        delivery:
          title: Delivery
          type: string
        eligibility:
          $ref: '#/components/schemas/Eligibility'
        evidence_tier:
          title: Evidence Tier
          type: string
        id:
          format: uuid
          title: Id
          type: string
        minted_reason:
          title: Minted Reason
          type: string
        origin:
          title: Origin
          type: string
        superseded_by_section_edit:
          title: Superseded By Section Edit
          type: boolean
        version_no:
          title: Version No
          type: integer
      required:
      - id
      - version_no
      - minted_reason
      - origin
      - evidence_tier
      - completeness
      - delivery
      - eligibility
      - superseded_by_section_edit
      - created_at
      title: VersionSummary
      type: object
  securitySchemes:
    TenantID:
      description: Tenant UUID injected by the API gateway; sets the RLS scope.
      in: header
      name: x-tenant-id
      type: apiKey
    TenantRoles:
      description: Comma-separated tenant roles injected by the gateway.
      in: header
      name: x-tenant-roles
      type: apiKey
    UserID:
      description: Authenticated user UUID injected by the API gateway.
      in: header
      name: x-user-id
      type: apiKey
info:
  title: retrieval-generation
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/internal/models:
    get:
      description: 'C-M1: model ids a tenant may select; 503 INFERENCE_UNAVAILABLE where unreadable.'
      operationId: list_models_api_internal_models_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogueResponse'
          description: Successful Response
      summary: List Models
      tags:
      - internal
  /api/v1/answers:
    post:
      description: 'R-2: a grounded answer streamed as ``draft`` frames then one ``verdict`` (§5.7.2).'
      operationId: answers_api_v1_answers_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Answers
      tags:
      - generation
  /api/v1/artefacts/{artefact_id}:
    get:
      description: 'A-1: the artefact with its current version, tier and eligibility verdict.'
      operationId: get_artefact_api_v1_artefacts__artefact_id__get
      parameters:
      - in: path
        name: artefact_id
        required: true
        schema:
          format: uuid
          title: Artefact Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtefactResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Artefact
      tags:
      - artefacts
  /api/v1/artefacts/{artefact_id}/regenerate:
    post:
      description: 'A-5: document scope. ``202`` and a handle resolved through W-2.


        A repeat from the same base version answers with the existing handle (``200``).'
      operationId: regenerate_document_api_v1_artefacts__artefact_id__regenerate_post
      parameters:
      - in: path
        name: artefact_id
        required: true
        schema:
          format: uuid
          title: Artefact Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateDocumentRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandleResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Regenerate Document
      tags:
      - regeneration
  /api/v1/artefacts/{artefact_id}/render:
    get:
      description: 'A-8: reserved. ``503 RENDERER_UNAVAILABLE`` after scope and artefact checks (S-6).'
      operationId: render_artefact_api_v1_artefacts__artefact_id__render_get
      parameters:
      - in: path
        name: artefact_id
        required: true
        schema:
          format: uuid
          title: Artefact Id
          type: string
      - in: query
        name: version_no
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Version No
      - in: query
        name: format
        required: false
        schema:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Format
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Render Artefact
      tags:
      - artefacts
  /api/v1/artefacts/{artefact_id}/sections:
    get:
      description: 'A-4: section states and per-section evidence tiers.'
      operationId: list_sections_api_v1_artefacts__artefact_id__sections_get
      parameters:
      - in: path
        name: artefact_id
        required: true
        schema:
          format: uuid
          title: Artefact Id
          type: string
      - description: Default 100; above 500 is clamped.
        in: query
        name: limit
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: Default 100; above 500 is clamped.
          title: Limit
      - in: query
        name: offset
        required: false
        schema:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          title: Offset
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionPage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Sections
      tags:
      - artefacts
  /api/v1/artefacts/{artefact_id}/sections/{section_ref}/fact-conflict-resolution:
    post:
      description: 'A-7: resolve a surfaced conflict once; the regeneration proceeds as a new request.'
      operationId: resolve_fact_conflict_api_v1_artefacts__artefact_id__sections__section_ref__fact_conflict_resolution_post
      parameters:
      - in: path
        name: artefact_id
        required: true
        schema:
          format: uuid
          title: Artefact Id
          type: string
      - in: path
        name: section_ref
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: Section Ref
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactConflictResolutionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactConflictResolutionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Resolve Fact Conflict
      tags:
      - regeneration
  /api/v1/artefacts/{artefact_id}/sections/{section_ref}/regenerate:
    post:
      description: 'A-6: section scope, streamed like R-3; the verdict frame names the new and prior versions.'
      operationId: regenerate_section_api_v1_artefacts__artefact_id__sections__section_ref__regenerate_post
      parameters:
      - in: path
        name: artefact_id
        required: true
        schema:
          format: uuid
          title: Artefact Id
          type: string
      - in: path
        name: section_ref
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: Section Ref
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateSectionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Regenerate Section
      tags:
      - regeneration
  /api/v1/artefacts/{artefact_id}/sections/{section_ref}/versions/{version_no}/content:
    get:
      description: 'A-9: the generated text of one section version.'
      operationId: get_section_content_api_v1_artefacts__artefact_id__sections__section_ref__versions__version_no__content_get
      parameters:
      - in: path
        name: artefact_id
        required: true
        schema:
          format: uuid
          title: Artefact Id
          type: string
      - in: path
        name: section_ref
        required: true
        schema:
          maxLength: 256
          title: Section Ref
          type: string
      - in: path
        name: version_no
        required: true
        schema:
          minimum: 1
          title: Version No
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionContentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Section Content
      tags:
      - artefacts
  /api/v1/artefacts/{artefact_id}/versions:
    get:
      description: 'A-2: version history, newest first.'
      operationId: list_versions_api_v1_artefacts__artefact_id__versions_get
      parameters:
      - in: path
        name: artefact_id
        required: true
        schema:
          format: uuid
          title: Artefact Id
          type: string
      - description: Default 100; above 500 is clamped.
        in: query
        name: limit
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: Default 100; above 500 is clamped.
          title: Limit
      - in: query
        name: offset
        required: false
        schema:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          title: Offset
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Versions
      tags:
      - artefacts
  /api/v1/artefacts/{artefact_id}/versions/{version_no}:
    get:
      description: 'A-3: one version with per-section groundedness, completeness and retrieval set refs.'
      operationId: get_version_api_v1_artefacts__artefact_id__versions__version_no__get
      parameters:
      - in: path
        name: artefact_id
        required: true
        schema:
          format: uuid
          title: Artefact Id
          type: string
      - in: path
        name: version_no
        required: true
        schema:
          minimum: 1
          title: Version No
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Version
      tags:
      - artefacts
  /api/v1/classification/propose:
    post:
      description: 'R-6: stateless role proposal. No collection scope is resolved (§5.7.6).'
      operationId: propose_classification_api_v1_classification_propose_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
