info:
  description: 'Generated by scripts/gen_api_docs.py from rag.application.events.contracts — do not edit
    by hand. Every event is an eventcommon Envelope with `source: llm-rag-service` and a PascalCase `type`
    that is also the SNS `EventType` attribute. Payloads carry identifiers, versions and status only (EVT-7).'
  title: LLM Retrieval & Generation Events
  version: 1.0.0
operations:
  consume-domainprofile-llm-invalidate-q:
    action: receive
    channel:
      $ref: '#/channels/domainprofile-llm-invalidate-q'
    summary: Consume DomainProfilePublished.
  consume-llm-document-rag-q:
    action: receive
    channel:
      $ref: '#/channels/llm-document-rag-q'
    summary: Consume DocumentPurged.
  consume-membership-rag-q:
    action: receive
    channel:
      $ref: '#/channels/membership-rag-q'
    summary: Consume TenantMembershipsPurged, TenantStateChanged.
  consume-tender-rag-q:
    action: receive
    channel:
      $ref: '#/channels/tender-rag-q'
    summary: Consume TenderDeclined, TenderLost, TenderPurged, TenderRestricted, TenderWithdrawn, TenderWon.
  consume-usage-rag-q:
    action: receive
    channel:
      $ref: '#/channels/usage-rag-q'
    summary: Consume TenantQuotaRestored.
  publish-llm-generation-events:
    action: send
