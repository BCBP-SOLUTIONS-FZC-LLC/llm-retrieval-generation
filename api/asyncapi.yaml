asyncapi: 3.0.0
channels:
  domainprofile-llm-invalidate-q:
    address: domainprofile-llm-invalidate-q
    description: SQS queue `domainprofile-llm-invalidate-q`.
    messages:
      DomainProfilePublished:
        $ref: '#/components/messages/DomainProfilePublished'
  llm-document-rag-q:
    address: llm-document-rag-q
    description: SQS queue `llm-document-rag-q`.
    messages:
      DocumentPurged:
        $ref: '#/components/messages/DocumentPurged'
  llm-generation-events:
    address: llm-generation-events
    description: SNS topic `llm-generation-events` (Glue-framed JSON Schema payloads).
    messages:
      ArtefactRegenerated:
        $ref: '#/components/messages/ArtefactRegenerated'
      ExtractionCompleted:
        $ref: '#/components/messages/ExtractionCompleted'
      GenerationCancelled:
        $ref: '#/components/messages/GenerationCancelled'
      GenerationCompleted:
        $ref: '#/components/messages/GenerationCompleted'
      GenerationFailed:
        $ref: '#/components/messages/GenerationFailed'
      GenerationGapReported:
        $ref: '#/components/messages/GenerationGapReported'
      GenerationProgressed:
        $ref: '#/components/messages/GenerationProgressed'
      GenerationStarted:
        $ref: '#/components/messages/GenerationStarted'
      OutlineReady:
        $ref: '#/components/messages/OutlineReady'
      SectionCompleted:
        $ref: '#/components/messages/SectionCompleted'
  llm-index-events:
    address: llm-index-events
    description: SNS topic `llm-index-events` (Glue-framed JSON Schema payloads).
    messages:
      CollectionPromoted:
        $ref: '#/components/messages/CollectionPromoted'
      CollectionProvisioned:
        $ref: '#/components/messages/CollectionProvisioned'
      CollectionStatusChanged:
        $ref: '#/components/messages/CollectionStatusChanged'
      CorpusConflictDetected:
        $ref: '#/components/messages/CorpusConflictDetected'
      IndexGenerationActivated:
        $ref: '#/components/messages/IndexGenerationActivated'
      IndexGenerationFailed:
        $ref: '#/components/messages/IndexGenerationFailed'
      ProfileCacheRefreshed:
        $ref: '#/components/messages/ProfileCacheRefreshed'
  membership-rag-q:
    address: membership-rag-q
    description: SQS queue `membership-rag-q`.
    messages:
      TenantMembershipsPurged:
        $ref: '#/components/messages/TenantMembershipsPurged'
      TenantStateChanged:
        $ref: '#/components/messages/TenantStateChanged'
  tender-rag-q:
    address: tender-rag-q
    description: SQS queue `tender-rag-q`.
    messages:
      TenderDeclined:
        $ref: '#/components/messages/TenderDeclined'
      TenderLost:
        $ref: '#/components/messages/TenderLost'
      TenderPurged:
        $ref: '#/components/messages/TenderPurged'
      TenderRestricted:
        $ref: '#/components/messages/TenderRestricted'
      TenderWithdrawn:
        $ref: '#/components/messages/TenderWithdrawn'
      TenderWon:
        $ref: '#/components/messages/TenderWon'
  usage-rag-q:
    address: usage-rag-q
    description: SQS queue `usage-rag-q`.
    messages:
      TenantQuotaRestored:
        $ref: '#/components/messages/TenantQuotaRestored'
components:
  messages:
    ArtefactRegenerated:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: ArtefactRegenerated
      contentType: application/json
      name: ArtefactRegenerated
      payload:
        $ref: '#/components/schemas/ArtefactRegenerated'
      summary: A regeneration minted a *document* version (a section one is ``SectionCompleted``).
      tags:
      - $ref: '#/components/tags/published'
      title: ArtefactRegenerated
    CollectionPromoted:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: CollectionPromoted
      contentType: application/json
      name: CollectionPromoted
      payload:
        $ref: '#/components/schemas/CollectionPromoted'
      summary: A promotion target; always names the collection the tender moved out of.
      tags:
      - $ref: '#/components/tags/published'
      title: CollectionPromoted
    CollectionProvisioned:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: CollectionProvisioned
      contentType: application/json
      name: CollectionProvisioned
      payload:
        $ref: '#/components/schemas/CollectionProvisioned'
      summary: C-I1 and the ``TenderRestricted`` consumer's creation.
      tags:
      - $ref: '#/components/tags/published'
      title: CollectionProvisioned
    CollectionStatusChanged:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: CollectionStatusChanged
      contentType: application/json
      name: CollectionStatusChanged
      payload:
        $ref: '#/components/schemas/CollectionStatusChanged'
      summary: Every status change but creation (LD-78); ``reason`` is the §12.3 five.
      tags:
      - $ref: '#/components/tags/published'
      title: CollectionStatusChanged
    CorpusConflictDetected:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: CorpusConflictDetected
      contentType: application/json
      name: CorpusConflictDetected
      payload:
        $ref: '#/components/schemas/CorpusConflictDetected'
      summary: Declared in the AsyncAPI file and **not published in v1** (LD-64, §9.8).
      tags:
      - $ref: '#/components/tags/published'
      title: CorpusConflictDetected
    DocumentPurged:
      contentType: application/json
      name: DocumentPurged
      payload:
        $ref: '#/components/schemas/DocumentPurged'
      summary: 'Ingestion''s erasure of a document: all four fields are in the match (EVT-1).'
      tags:
      - $ref: '#/components/tags/consumed'
      title: DocumentPurged
    DomainProfilePublished:
      contentType: application/json
      name: DomainProfilePublished
      payload:
        $ref: '#/components/schemas/DomainProfilePublished'
      summary: 'A republished profile: clears this service''s cache, never a pinned workflow (EVT-4).'
      tags:
      - $ref: '#/components/tags/consumed'
      title: DomainProfilePublished
    ExtractionCompleted:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: ExtractionCompleted
      contentType: application/json
      name: ExtractionCompleted
      payload:
        $ref: '#/components/schemas/ExtractionCompleted'
      summary: R-4's and W-6's write transaction (LD-84).
      tags:
      - $ref: '#/components/tags/published'
      title: ExtractionCompleted
    GenerationCancelled:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: GenerationCancelled
      contentType: application/json
      name: GenerationCancelled
      payload:
        $ref: '#/components/schemas/GenerationCancelled'
      summary: W-5. A cancellation is not a failure, so no ``run_failure_reason``.
      tags:
      - $ref: '#/components/tags/published'
      title: GenerationCancelled
    GenerationCompleted:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: GenerationCompleted
      contentType: application/json
      name: GenerationCompleted
      payload:
        $ref: '#/components/schemas/GenerationCompleted'
      summary: A version was written; short-form included (GEN-10). No approval state (AOB-1, EVT-11).
      tags:
      - $ref: '#/components/tags/published'
      title: GenerationCompleted
    GenerationFailed:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: GenerationFailed
      contentType: application/json
      name: GenerationFailed
      payload:
        $ref: '#/components/schemas/GenerationFailed'
      summary: A workflow ended without a version. ``reason`` is ``run_failure_reason`` exactly.
      tags:
      - $ref: '#/components/tags/published'
      title: GenerationFailed
    GenerationGapReported:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: GenerationGapReported
      contentType: application/json
      name: GenerationGapReported
      payload:
        $ref: '#/components/schemas/GenerationGapReported'
      summary: A blocking required-input failure (§6.9). Entity *keys* only, never values.
      tags:
      - $ref: '#/components/tags/published'
      title: GenerationGapReported
    GenerationProgressed:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: GenerationProgressed
      contentType: application/json
      name: GenerationProgressed
      payload:
        $ref: '#/components/schemas/GenerationProgressed'
      summary: Every stage transition of an async run (LD-51); ``progress_seq`` orders it (EVT-13).
      tags:
      - $ref: '#/components/tags/published'
      title: GenerationProgressed
    GenerationStarted:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: GenerationStarted
      contentType: application/json
      name: GenerationStarted
      payload:
        $ref: '#/components/schemas/GenerationStarted'
      summary: Every admission, synchronous or not, in the shell's transaction (ASYNC-2, RUN-1, GEN-10).
      tags:
      - $ref: '#/components/tags/published'
      title: GenerationStarted
    IndexGenerationActivated:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: IndexGenerationActivated
      contentType: application/json
      name: IndexGenerationActivated
      payload:
        $ref: '#/components/schemas/IndexGenerationActivated'
      summary: C-I4's cutover transaction.
      tags:
      - $ref: '#/components/tags/published'
      title: IndexGenerationActivated
    IndexGenerationFailed:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: IndexGenerationFailed
      contentType: application/json
      name: IndexGenerationFailed
      payload:
        $ref: '#/components/schemas/IndexGenerationFailed'
      summary: The ``failed`` row's transaction (LD-67). Nothing writes one in v1.
      tags:
      - $ref: '#/components/tags/published'
      title: IndexGenerationFailed
    OutlineReady:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: OutlineReady
      contentType: application/json
      name: OutlineReady
      payload:
        $ref: '#/components/schemas/OutlineReady'
      summary: The workflow suspends on the human gate (§9.4).
      tags:
      - $ref: '#/components/tags/published'
      title: OutlineReady
    ProfileCacheRefreshed:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: ProfileCacheRefreshed
      contentType: application/json
      name: ProfileCacheRefreshed
      payload:
        $ref: '#/components/schemas/ProfileCacheRefreshed'
      summary: An operational signal about this service's own pack cache (§12.3).
      tags:
      - $ref: '#/components/tags/published'
      title: ProfileCacheRefreshed
    SectionCompleted:
      bindings:
        sns:
          messageAttributes:
            EventType:
              value: SectionCompleted
      contentType: application/json
      name: SectionCompleted
      payload:
        $ref: '#/components/schemas/SectionCompleted'
      summary: Once per section. A gap or failure has no version, so those fields are absent (AS-7).
      tags:
      - $ref: '#/components/tags/published'
      title: SectionCompleted
    TenantMembershipsPurged:
      contentType: application/json
      name: TenantMembershipsPurged
      payload:
        $ref: '#/components/schemas/TenantMembershipsPurged'
      summary: IAM's tenant-offboarding cascade signal; ``actor_id`` is optional.
      tags:
      - $ref: '#/components/tags/consumed'
      title: TenantMembershipsPurged
    TenantQuotaRestored:
      contentType: application/json
      name: TenantQuotaRestored
      payload:
        $ref: '#/components/schemas/TenantQuotaRestored'
      summary: Only a token ``resource`` acts, because only a token quota suspends a run (LD-70).
      tags:
      - $ref: '#/components/tags/consumed'
      title: TenantQuotaRestored
    TenantStateChanged:
      contentType: application/json
      name: TenantStateChanged
      payload:
        $ref: '#/components/schemas/TenantStateChanged'
      summary: IAM's relay of one of seven statuses; ``cause`` is free text, never branched on.
      tags:
      - $ref: '#/components/tags/consumed'
      title: TenantStateChanged
    TenderDeclined:
      contentType: application/json
      name: TenderDeclined
      payload:
        $ref: '#/components/schemas/TenderDeclined'
      summary: 'Any Tender event this service reads: restricted, purged, or a terminal outcome.'
      tags:
      - $ref: '#/components/tags/consumed'
      title: TenderDeclined
    TenderLost:
      contentType: application/json
      name: TenderLost
      payload:
        $ref: '#/components/schemas/TenderLost'
      summary: 'Any Tender event this service reads: restricted, purged, or a terminal outcome.'
      tags:
      - $ref: '#/components/tags/consumed'
      title: TenderLost
    TenderPurged:
      contentType: application/json
      name: TenderPurged
      payload:
        $ref: '#/components/schemas/TenderPurged'
      summary: 'Any Tender event this service reads: restricted, purged, or a terminal outcome.'
      tags:
      - $ref: '#/components/tags/consumed'
      title: TenderPurged
    TenderRestricted:
      contentType: application/json
      name: TenderRestricted
      payload:
        $ref: '#/components/schemas/TenderRestricted'
      summary: 'Any Tender event this service reads: restricted, purged, or a terminal outcome.'
      tags:
      - $ref: '#/components/tags/consumed'
      title: TenderRestricted
    TenderWithdrawn:
      contentType: application/json
      name: TenderWithdrawn
      payload:
        $ref: '#/components/schemas/TenderWithdrawn'
      summary: 'Any Tender event this service reads: restricted, purged, or a terminal outcome.'
      tags:
      - $ref: '#/components/tags/consumed'
      title: TenderWithdrawn
    TenderWon:
      contentType: application/json
      name: TenderWon
      payload:
        $ref: '#/components/schemas/TenderWon'
      summary: 'Any Tender event this service reads: restricted, purged, or a terminal outcome.'
      tags:
      - $ref: '#/components/tags/consumed'
      title: TenderWon
  schemas:
    ArtefactRegenerated:
      additionalProperties: true
      description: A regeneration minted a *document* version (a section one is ``SectionCompleted``).
      properties:
        artefact_id:
          title: Artefact Id
          type: string
        artefact_version_id:
          title: Artefact Version Id
          type: string
        base_version_id:
          title: Base Version Id
          type: string
        completeness:
          $ref: '#/components/schemas/ArtefactRegenerated_CompletenessVerdict'
        evidence_tier:
          $ref: '#/components/schemas/ArtefactRegenerated_EvidenceTier'
        origin:
          $ref: '#/components/schemas/ArtefactRegenerated_ArtefactOrigin'
        principal_id:
          title: Principal Id
          type: string
        recipients:
          items:
            $ref: '#/components/schemas/ArtefactRegenerated_Recipient'
          title: Recipients
          type: array
        scope:
          title: Scope
          type: string
        tender_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Tender Id
        version_no:
          title: Version No
          type: integer
      required:
      - artefact_id
      - artefact_version_id
      - version_no
      - base_version_id
      - principal_id
      - scope
      - origin
      - evidence_tier
      - completeness
      title: ArtefactRegenerated
      type: object
    ArtefactRegenerated_ArtefactOrigin:
      description: How an artefact version came to exist.
      enum:
      - original
      - regeneration
      - coherence_repair
      title: ArtefactOrigin
      type: string
    ArtefactRegenerated_CompletenessVerdict:
      description: Completeness verdict (§8.2).
      enum:
      - complete
      - partial
      - insufficient
      - not_computed
      title: CompletenessVerdict
      type: string
    ArtefactRegenerated_EvidenceTier:
      description: Evidence tier; ``NOT_COMPUTED`` sorts lowest so the roll-up is ``min()`` (MD-24, LD-56).
      enum:
      - NOT_COMPUTED
      - INSUFFICIENT
      - PARTIAL
      - SUPPORTED
      title: EvidenceTier
      type: string
    ArtefactRegenerated_Recipient:
      additionalProperties: true
      description: '``{kind, id}`` echoed from the request that started the run (LD-83).


        ``kind`` is ``user`` or ``department``; the request refuses any other.'
      properties:
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
      required:
      - kind
      - id
      title: Recipient
      type: object
    CollectionPromoted:
      additionalProperties: true
      description: A promotion target; always names the collection the tender moved out of.
      properties:
        collection_id:
          title: Collection Id
          type: string
        promoted_from:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Promoted From
        restricted:
          title: Restricted
          type: boolean
        status:
          title: Status
          type: string
        tender_id:
          title: Tender Id
          type: string
        type:
          title: Type
          type: string
      required:
      - collection_id
      - tender_id
      - type
      - restricted
      - status
      title: CollectionPromoted
      type: object
    CollectionProvisioned:
      additionalProperties: true
      description: C-I1 and the ``TenderRestricted`` consumer's creation.
      properties:
        collection_id:
          title: Collection Id
          type: string
        promoted_from:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Promoted From
        restricted:
          title: Restricted
          type: boolean
        status:
          title: Status
          type: string
        tender_id:
          title: Tender Id
          type: string
        type:
          title: Type
          type: string
      required:
      - collection_id
      - tender_id
      - type
      - restricted
      - status
      title: CollectionProvisioned
      type: object
    CollectionStatusChanged:
      additionalProperties: true
      description: Every status change but creation (LD-78); ``reason`` is the §12.3 five.
      properties:
        collection_id:
          title: Collection Id
          type: string
        from_status:
          title: From Status
          type: string
        reason:
          title: Reason
          type: string
        tender_id:
          title: Tender Id
          type: string
        to_status:
          title: To Status
          type: string
        type:
          title: Type
          type: string
      required:
      - collection_id
      - tender_id
      - type
      - from_status
      - to_status
      - reason
      title: CollectionStatusChanged
      type: object
    CorpusConflictDetected:
      additionalProperties: true
      description: Declared in the AsyncAPI file and **not published in v1** (LD-64, §9.8).
      properties:
        checked_at:
          title: Checked At
          type: string
        collection_id:
          title: Collection Id
          type: string
        conflict_count:
          title: Conflict Count
          type: integer
        conflicts:
          items:
            $ref: '#/components/schemas/CorpusConflictDetected_ConflictEntry'
          title: Conflicts
          type: array
        index_generation:
          title: Index Generation
          type: integer
        tender_id:
          title: Tender Id
          type: string
        truncated:
          title: Truncated
          type: boolean
      required:
      - collection_id
      - tender_id
      - index_generation
      - checked_at
      - conflicts
      - conflict_count
      - truncated
      title: CorpusConflictDetected
      type: object
    CorpusConflictDetected_ConflictEntry:
      additionalProperties: true
      description: 'One disagreement: a fact key and the identifiers behind it, never the text (CONF-2).'
      properties:
        chunk_ids:
          items:
            type: string
          title: Chunk Ids
          type: array
        document_ids:
          items:
            type: string
          title: Document Ids
          type: array
        fact_key:
          title: Fact Key
          type: string
        severity:
          title: Severity
          type: string
      required:
      - fact_key
      - severity
      - chunk_ids
      - document_ids
      title: ConflictEntry
      type: object
    DocumentPurged:
      description: 'Ingestion''s erasure of a document: all four fields are in the match (EVT-1).'
      properties:
        collection_id:
          format: uuid
          title: Collection Id
          type: string
        document_id:
          format: uuid
          title: Document Id
          type: string
        document_version:
          title: Document Version
          type: integer
        tenant_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Tenant Id
      required:
      - document_id
      - document_version
      - collection_id
      title: DocumentPurged
      type: object
    DomainProfilePublished:
      description: 'A republished profile: clears this service''s cache, never a pinned workflow (EVT-4).'
      properties:
        concern:
          title: Concern
          type: string
        domain:
          title: Domain
          type: string
        language:
          title: Language
          type: string
        tenant_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Tenant Id
        version:
          title: Version
          type: string
      required:
      - domain
      - language
      - concern
      - version
      title: DomainProfilePublished
      type: object
    ExtractionCompleted:
      additionalProperties: true
      description: R-4's and W-6's write transaction (LD-84).
      properties:
        artefact_id:
          title: Artefact Id
          type: string
        artefact_version_id:
          title: Artefact Version Id
          type: string
        evidence_tier:
          $ref: '#/components/schemas/ExtractionCompleted_EvidenceTier'
        generation_id:
          title: Generation Id
          type: string
        principal_id:
          title: Principal Id
          type: string
        recipients:
          items:
            $ref: '#/components/schemas/ExtractionCompleted_Recipient'
          title: Recipients
          type: array
        schema_version:
          title: Schema Version
          type: string
        tender_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Tender Id
        trigger_document_version_id:
          title: Trigger Document Version Id
          type: string
      required:
      - artefact_id
      - artefact_version_id
      - generation_id
      - principal_id
      - trigger_document_version_id
      - schema_version
      - evidence_tier
      title: ExtractionCompleted
      type: object
    ExtractionCompleted_EvidenceTier:
      description: Evidence tier; ``NOT_COMPUTED`` sorts lowest so the roll-up is ``min()`` (MD-24, LD-56).
      enum:
      - NOT_COMPUTED
      - INSUFFICIENT
      - PARTIAL
      - SUPPORTED
      title: EvidenceTier
      type: string
    ExtractionCompleted_Recipient:
      additionalProperties: true
      description: '``{kind, id}`` echoed from the request that started the run (LD-83).


        ``kind`` is ``user`` or ``department``; the request refuses any other.'
      properties:
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
      required:
      - kind
      - id
      title: Recipient
      type: object
    GenerationCancelled:
      additionalProperties: true
      description: W-5. A cancellation is not a failure, so no ``run_failure_reason``.
      properties:
        artefact_id:
          title: Artefact Id
          type: string
        generation_id:
          title: Generation Id
          type: string
        principal_id:
          title: Principal Id
          type: string
        reason:
          title: Reason
          type: string
        recipients:
          items:
            $ref: '#/components/schemas/GenerationCancelled_Recipient'
          title: Recipients
          type: array
        sections_complete:
          title: Sections Complete
          type: integer
        sections_durable:
          title: Sections Durable
          type: boolean
        sections_total:
          title: Sections Total
          type: integer
        tender_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Tender Id
      required:
      - artefact_id
      - generation_id
      - principal_id
      - reason
      - sections_complete
      - sections_total
      - sections_durable
      title: GenerationCancelled
      type: object
    GenerationCancelled_Recipient:
      additionalProperties: true
      description: '``{kind, id}`` echoed from the request that started the run (LD-83).


        ``kind`` is ``user`` or ``department``; the request refuses any other.'
      properties:
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
      required:
      - kind
      - id
      title: Recipient
      type: object
    GenerationCompleted:
      additionalProperties: true
      description: A version was written; short-form included (GEN-10). No approval state (AOB-1, EVT-11).
      properties:
        artefact_id:
          title: Artefact Id
          type: string
        artefact_version_id:
          title: Artefact Version Id
          type: string
        coherence_verdict:
          anyOf:
          - $ref: '#/components/schemas/GenerationCompleted_CoherenceVerdict'
          - type: 'null'
          default: null
        completeness:
          $ref: '#/components/schemas/GenerationCompleted_CompletenessVerdict'
        delivery:
          $ref: '#/components/schemas/GenerationCompleted_DeliveryState'
        evidence_tier:
          $ref: '#/components/schemas/GenerationCompleted_EvidenceTier'
        generation_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Generation Id
